<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>magpie-hud · 界面原型</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #17191e;
      --raised: #20232a;
      --ink: #f2f0f2;
      --secondary: #9ba0aa;
      --route: #e064a2;
      --warning: #d4b174;
      --edge: #343840;
      font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #101217;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 32px; }
    button, select { font: inherit; }
    button { cursor: pointer; }
    button, select { color: var(--ink); }
    button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--route); outline-offset: 4px;
    }
    [hidden] { display: none !important; }
    .workbench { max-width: 1040px; margin: auto; }
    .preview-heading { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
    .preview-heading h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
    .preview-heading p { color: var(--secondary); margin: 0; font-size: 12px; }
    .preview-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
    .preview-tools label { color: var(--secondary); margin-right: 2px; }
    .preview-tools select, .preview-button {
      background: var(--raised); border: 1px solid var(--edge); border-radius: 6px;
      height: 34px; padding: 0 12px;
    }
    .preview-tools select { min-width: 152px; }
    .preview-button:hover { background: #2b2f38; }
    .preview-button[aria-pressed="true"] { border-color: var(--route); }
    .desktop {
      position: relative; display: grid; place-items: center; padding: 56px 24px;
      min-height: 416px; border: 1px solid #2a2e37; border-radius: 12px;
      background: #242933;
    }
    .hud {
      width: 840px; max-width: 100%; height: 280px;
      display: grid; grid-template-rows: 44px minmax(0, 1fr) 82px;
      border: 1px solid #41434c; border-radius: 14px; overflow: hidden;
      background: rgb(23 25 30 / 97%);
      box-shadow: 0 16px 44px rgb(0 0 0 / 32%);
    }
    .hud.is-narrow { width: 720px; }
    .window-bar { display: flex; align-items: center; padding: 0 12px 0 22px; gap: 10px; user-select: none; }
    .brand-mark { width: 19px; height: 19px; color: var(--ink); }
    .brand-name { font-family: Bahnschrift, "Segoe UI", sans-serif; font-size: 17px; letter-spacing: -.6px; font-weight: 600; }
    .brand-subtitle { color: var(--secondary); font-size: 11px; padding-left: 12px; border-left: 1px solid var(--edge); }
    .watch-state { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--secondary); font-size: 11px; }
    .watch-icon { width: 13px; height: 13px; }
    .watch-icon .state-warning, .watch-icon .state-waiting { display: none; }
    .hud[data-state="warning"] .state-normal, .hud[data-state="waiting"] .state-normal { display: none; }
    .hud[data-state="warning"] .state-warning, .hud[data-state="waiting"] .state-waiting { display: initial; }
    .hud[data-state="warning"] .watch-icon { color: var(--warning); }
    .window-controls { display: flex; align-items: center; gap: 2px; margin-left: 8px; }
    .window-button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); }
    .window-button svg { width: 15px; height: 15px; }
    .window-button:hover { color: var(--ink); background: #30333c; }
    .window-button[aria-pressed="true"] { color: var(--ink); background: #2c2d36; }
    .flow {
      display: grid; grid-template-columns: minmax(0, 1fr) 64px 120px 64px minmax(0, 1.33fr);
      align-items: center; padding: 4px 24px 12px; min-width: 0;
    }
    .agent-node, .router-node, .account-node { min-width: 0; }
    .node-caption { display: block; color: var(--secondary); font-size: 11px; margin-bottom: 8px; }
    .agent-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; min-width: 0; }
    .agent-icon { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; background: #30313b; flex-shrink: 0; }
    .agent-icon svg { width: 17px; height: 17px; }
    .agent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
    .agent-request { display: block; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .router-node { text-align: center; align-self: stretch; display: flex; align-items: center; flex-direction: column; justify-content: center; padding-top: 4px; }
    .router-emblem { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #2b2631; border: 1px solid #634153; margin-bottom: 8px; }
    .router-emblem svg { width: 24px; height: 24px; }
    .router-name { font-family: Bahnschrift, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; line-height: 1; letter-spacing: -.7px; }
    .router-host { color: var(--secondary); font-size: 10px; margin-top: 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-node {
      position: relative; padding: 13px 14px; background: var(--raised);
      border: 1px solid #684355; border-radius: 9px;
    }
    .account-node::before { content: ""; position: absolute; left: -1px; top: 22px; bottom: 22px; width: 3px; background: var(--route); border-radius: 2px; }
    .account-caption { display: flex; align-items: center; gap: 6px; color: var(--secondary); font-size: 11px; margin-bottom: 8px; }
    .account-caption svg { color: var(--route); width: 12px; height: 12px; }
    .account-name { font-size: 14px; font-weight: 600; line-height: 20px; margin: 0 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-model { font-size: 11px; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .connector { width: 100%; height: 112px; overflow: visible; }
    .route-track, .route-current, .route-flare { fill: none; stroke-linecap: round; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .route-track { stroke: #444851; }
    .route-current { stroke: var(--route); opacity: .86; }
    .route-flare { stroke: #f2f0f2; stroke-width: 2.5; stroke-dasharray: 12 100; opacity: 0; }
    .port { fill: var(--route); stroke: var(--surface); stroke-width: 2; }
    .hud[data-active="false"] .route-current, .hud[data-active="false"] .route-flare { opacity: 0 !important; }
    .hud[data-active="false"] .port { fill: #676b76; }
    .hud[data-active="false"] .account-node { border-color: var(--edge); }
    .hud[data-active="false"] .account-node::before { background: #676b76; }
    .hud[data-active="false"] .account-caption svg { color: var(--secondary); }
    .hud[data-active="false"] .router-emblem { border-color: var(--edge); background: var(--raised); }
    .route-notes { border-top: 1px solid #30333c; background: rgb(0 0 0 / 10%); padding: 8px 22px; display: grid; grid-template-rows: 32px 32px; gap: 0; min-width: 0; }
    .note-row { display: grid; grid-template-columns: 60px 43px minmax(0, 1fr); align-items: center; gap: 12px; min-width: 0; }
    .note-time { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--secondary); white-space: nowrap; }
    .note-kind { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--secondary); white-space: nowrap; }
    .note-kind svg { width: 11px; height: 11px; flex-shrink: 0; }
    .note-kind.primary svg { color: var(--route); }
    .note-text { margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; line-height: 22px; }
    .note-row:last-child .note-text { color: var(--secondary); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .preview-caption { margin-top: 18px; color: var(--secondary); font-size: 12px; line-height: 1.8; }
    .preview-caption p { margin: 0; }
    .preview-caption strong { color: var(--ink); font-weight: 500; }
    .tray-preview { position: relative; margin-left: auto; }
    .tray-menu { position: absolute; z-index: 2; top: 42px; right: 0; width: 178px; padding: 5px; background: #20232a; border: 1px solid #4a4c56; border-radius: 8px; box-shadow: 0 10px 28px #0006; }
    .tray-menu button { display: block; width: 100%; padding: 9px 12px; text-align: left; border: 0; border-radius: 4px; background: transparent; }
    .tray-menu button:hover { background: #343840; }
    .tray-menu hr { border: 0; border-top: 1px solid var(--edge); margin: 4px; }
    .hidden-message { color: var(--secondary); text-align: center; line-height: 2; }
    .hidden-message button { margin-top: 12px; }
    .preview-feedback { min-height: 20px; color: var(--secondary); margin-top: 8px; }
    @media (max-width: 850px) {
      body { padding: 24px 16px; }
      .desktop { padding: 32px 12px; min-height: 360px; }
      .flow { padding-inline: 18px; grid-template-columns: minmax(0, 1fr) 40px 104px 40px minmax(0, 1.25fr); }
      .brand-subtitle { display: none; }
      .agent-name { font-size: 13px; }
      .account-node { padding-inline: 10px; }
      .account-name { font-size: 12px; }
      .note-row { gap: 8px; }
      .route-notes { padding-inline: 18px; }
    }
    @media (max-width: 560px) {
      body { padding: 18px 10px; }
      .preview-heading { display: block; }
      .preview-heading p { margin-top: 8px; }
      .desktop { padding: 18px 8px; min-height: 380px; }
      .hud { height: 308px; }
      .window-bar { padding-left: 14px; gap: 7px; }
      .watch-state { font-size: 10px; gap: 4px; }
      .window-controls { margin-left: 0; }
      .window-button { width: 26px; }
      .flow { padding: 2px 12px 10px; grid-template-columns: minmax(0, 1fr) 18px 64px 18px minmax(0, 1.25fr); }
      .agent-icon { display: none; }
      .agent-name { font-size: 11px; }
      .agent-request { font-size: 10px; }
      .router-name { font-size: 16px; }
      .router-host { font-size: 9px; }
      .account-node { padding: 10px 7px; }
      .account-caption { font-size: 10px; gap: 4px; }
      .account-name, .account-model { font-size: 10px; }
      .route-notes { padding-inline: 12px; }
      .note-row { grid-template-columns: 53px 34px minmax(0, 1fr); gap: 6px; }
      .note-time, .note-kind { font-size: 10px; }
      .note-text { font-size: 11px; }
      .tray-preview { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .route-flare { display: none; } }
    @media (forced-colors: active) {
      .hud, .account-node, .router-emblem { border-color: CanvasText; }
      .route-current { stroke: Highlight; }
      .port { fill: Highlight; }
      .account-node::before { background: Highlight; }
    }
  </style>
</head>
<body>
  <main class="workbench">
    <header class="preview-heading">
      <h1>路由悬浮窗</h1>
      <p>界面原型 · 演示数据 · 默认 840 × 280</p>
    </header>
    <div class="preview-tools" aria-label="原型演示工具，不属于产品窗口">
      <label for="preview-state">查看状态</label>
      <select id="preview-state">
        <option value="success">最新命中</option>
        <option value="waiting">等待记录</option>
        <option value="missing">文件不存在</option>
        <option value="warning">坏行，保留上一帧</option>
        <option value="partial">缺少可选字段</option>
        <option value="long">长账号与模型</option>
      </select>
      <button class="preview-button" id="replay" type="button">重播命中</button>
      <button class="preview-button" id="next-route" type="button">下一条路由</button>
      <button class="preview-button" id="narrow" type="button" aria-pressed="false">720px 宽度</button>
      <div class="tray-preview">
        <button class="preview-button" id="tray-toggle" type="button" aria-expanded="false" aria-controls="tray-menu">托盘菜单</button>
        <div id="tray-menu" class="tray-menu" hidden aria-label="托盘菜单示意">
          <button id="tray-show" type="button">显示窗口</button>
          <button id="tray-hide" type="button">隐藏窗口</button>
          <hr>
          <button id="tray-exit" type="button">退出</button>
        </div>
      </div>
    </div>
    <section class="desktop" aria-label="桌面中的悬浮窗原型">
      <article class="hud" id="hud" data-active="true" data-state="success" aria-label="Magpie 路由监视悬浮窗">
        <header class="window-bar" data-tauri-drag-region>
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16 7 5l5 9L17 5l4 11M7 5l5 3 5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="brand-name">magpie</span>
          <span class="brand-subtitle">路由监视</span>
          <div class="watch-state" role="status">
            <svg class="watch-icon" viewBox="0 0 16 16" aria-hidden="true">
              <g class="state-normal" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.4"/><path d="m5.4 8 1.7 1.7 3.5-3.5"/></g>
              <g class="state-waiting" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="5.4"/><path d="M8 4.6V8l2.4 1.4"/></g>
              <g class="state-warning" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m8 2 6 11H2Z"/><path d="M8 6v3m0 1.4v1"/></g>
            </svg>
            <span id="watch-label">最近一次路由</span>
          </div>
          <div class="window-controls">
            <button id="pin" class="window-button" type="button" aria-pressed="true" aria-label="置顶窗口" title="置顶已开启（原型）">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3h6m-5 0v5l-3 3v1h10v-1l-3-3V3M10 12v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="hide-window" class="window-button" type="button" aria-label="隐藏到托盘" title="隐藏到托盘（原型）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          </div>
        </header>
        <div class="flow" aria-label="请求来源经过 magpie 到达本次命中账号">
          <section class="agent-node" tabindex="0" aria-label="请求来源">
            <span class="node-caption">请求来源</span>
            <div class="agent-heading">
              <span class="agent-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6M8.6 3.7l6.8 16.6M3.7 8.6l16.6 6.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
              <strong class="agent-name" id="agent-name">Claude Desktop</strong>
            </div>
            <span class="agent-request" id="agent-request" title="group/smart-split">group/smart-split</span>
          </section>
          <svg class="connector" viewBox="0 0 100 112" preserveAspectRatio="none" aria-hidden="true">
            <path class="route-track" d="M6 65C46 65 42 38 94 38"/>
            <path class="route-current" d="M6 65C46 65 42 38 94 38"/>
            <path class="route-flare" pathLength="100" d="M6 65C46 65 42 38 94 38"/>
            <circle class="port" cx="6" cy="65" r="4"/><circle class="port" cx="94" cy="38" r="4"/>
          </svg>
          <section class="router-node" tabindex="0" aria-label="本机 magpie 路由器">
            <div class="router-emblem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16 7 5l5 9L17 5l4 11M7 5l5 3 5-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
            <strong class="router-name">magpie</strong>
            <span class="router-host" title="127.0.0.1:3425">127.0.0.1:3425</span>
          </section>
          <svg class="connector" viewBox="0 0 100 112" preserveAspectRatio="none" aria-hidden="true">
            <path class="route-track" d="M6 38C58 38 54 65 94 65"/>
            <path class="route-current" d="M6 38C58 38 54 65 94 65"/>
            <path class="route-flare" pathLength="100" d="M6 38C58 38 54 65 94 65"/>
            <circle class="port" cx="6" cy="38" r="4"/><circle class="port" cx="94" cy="65" r="4"/>
          </svg>
          <section class="account-node" tabindex="0" aria-label="本次命中账号">
            <span class="account-caption"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="account-caption">本次命中</span></span>
            <h2 class="account-name" id="account-name">relay-01@example.com</h2>
            <span class="account-model" id="account-model">grok-4.7-build-fast@500k</span>
          </section>
        </div>
        <section class="route-notes" aria-label="最新路由说明，固定两行" aria-live="polite" aria-atomic="true">
          <div class="note-row">
            <span class="note-time" id="line1-time">20:33:19</span>
            <span class="note-kind primary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="line1-kind">命中</span></span>
            <p class="note-text" id="line1-text"></p>
          </div>
          <div class="note-row">
            <span class="note-time" id="line2-time">20:33:19</span>
            <span class="note-kind"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="line2-kind">说明</span></span>
            <p class="note-text" id="line2-text"></p>
          </div>
        </section>
      </article>
      <div id="hidden-message" class="hidden-message" hidden>
        <div id="hidden-label">窗口已隐藏，文件监视继续。</div>
        <button id="restore-window" class="preview-button" type="button">显示窗口</button>
      </div>
    </section>
    <footer class="preview-caption">
      <p><strong>演示数据。</strong> 页面只验证界面与状态，不读取本机日志。悬浮窗中的按钮目前仅模拟操作。</p>
      <p>移到文字上可查看完整内容。置顶、拖动、系统托盘和多屏边界将在 Tauri 接入后验收。</p>
      <div class="preview-feedback" id="preview-feedback" role="status"></div>
    </footer>
  </main>
  <script>
    // 独立 UI 原型：只消费本页固定示例，不读取日志、不调用 Tauri 或 HTTP API。
    (() => {
      const samples = [
        {
          time: '20:33:19', agent: 'Claude Desktop', request: 'group/smart-split',
          account: 'relay-01@example.com', model: 'grok-4.7-build-fast@500k',
          summary: 'relay-01@example.com (grok-4.7-build-fast@500k) 以 low 用 3.8s 完成 · 190.0k token · 3.0s 后首响 · 缓存命中率 92.0%（估算）。req=group/smart-split',
          explanation: '候补/其它账号未选中（占位说明，日志未提供完整排除原因）'
        },
        {
          time: '20:34:07', agent: 'Claude Desktop', request: 'group/smart-split',
          account: 'relay-02@example.com', model: 'GLM-5.3',
          summary: 'relay-02@example.com (GLM-5.3) 以 high 用 2.4s 完成 · 48.0k token · 0.9s 后首响。req=group/smart-split',
          explanation: '候补/其它账号未选中（占位说明，日志未提供完整排除原因）'
        }
      ];
      const hud = document.getElementById('hud');
      const stateSelect = document.getElementById('preview-state');
      const feedback = document.getElementById('preview-feedback');
      const trayMenu = document.getElementById('tray-menu');
      const trayToggle = document.getElementById('tray-toggle');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let sampleIndex = 0;
      let lastValidSample = samples[0];
      let animations = [];

      /** 将完整显示值写入固定元素及原生悬停提示；输入只按文字呈现，不解析 HTML。 */
      function showText(id, text) {
        const element = document.getElementById(id);
        element.textContent = text;
        element.title = text;
      }

      /** 仅在新示例或用户重播时播放 320ms 高亮；连续触发取消前一动画，减少动态效果时跳过。 */
      function pulseRoute() {
        animations.forEach(animation => animation.cancel());
        animations = [];
        if (hud.dataset.active !== 'true' || reducedMotion.matches || hud.hidden) return;
        animations = [...document.querySelectorAll('.route-flare')].map(path => path.animate([
          { strokeDashoffset: 112, opacity: 0 },
          { opacity: 1, offset: .15 },
          { strokeDashoffset: -12, opacity: 0 }
        ], { duration: 320, easing: 'linear' }));
      }

      /** 按选定示例一次更新图与两行说明；坏行状态保留有效快照，空态不给出虚构时间。 */
      function renderState(name) {
        const isEmpty = name === 'waiting' || name === 'missing';
        const isWarning = name === 'warning' || name === 'missing';
        let sample = name === 'warning' ? lastValidSample : samples[sampleIndex];
        if (name === 'partial') {
          sample = { time: '--:--:--', agent: 'Claude Desktop', request: '请求模型未提供', account: 'relay-01@example.com', model: '服务模型未提供', summary: 'relay-01@example.com 已命中；日志未提供时间、模型与耗时，未估算统计。', explanation: '完整排除原因未提供' };
        } else if (name === 'long') {
          sample = { ...sample, account: 'routing-observer-with-a-very-long-address@example.com', model: 'provider/grok-4.7-build-fast-with-long-model-name@500k', summary: 'routing-observer-with-a-very-long-address@example.com (provider/grok-4.7-build-fast-with-long-model-name@500k) 以 low 用 3.8s 完成 · 190.0k token · 3.0s 后首响 · 缓存命中率 92.0%（估算）。req=group/smart-split' };
        }
        if (!isEmpty && name !== 'warning') lastValidSample = sample;
        hud.dataset.active = String(!isEmpty);
        hud.dataset.state = isWarning ? 'warning' : name;
        showText('watch-label', name === 'warning' ? '解析异常 · 保留上一帧' : name === 'missing' ? '文件未检测到' : isEmpty ? '等待记录' : '最近一次路由');
        showText('agent-name', isEmpty ? '等待请求' : sample.agent);
        showText('agent-request', isEmpty ? '请求模型待记录' : sample.request);
        showText('account-caption', isEmpty ? '等待记录' : '本次命中');
        showText('account-name', isEmpty ? '尚无命中账号' : sample.account);
        showText('account-model', isEmpty ? '服务模型待记录' : sample.model);
        showText('line1-time', isEmpty ? '--:--:--' : sample.time);
        showText('line2-time', isEmpty ? '--:--:--' : sample.time);
        showText('line1-kind', isEmpty ? '等待' : '命中');
        showText('line2-kind', isEmpty ? '路径' : '说明');
        showText('line1-text', name === 'missing' ? '未检测到 Magpie usage.jsonl，请确认 Magpie 已运行过' : isEmpty ? '等待 Magpie 路由写入…' : sample.summary);
        showText('line2-text', isEmpty ? '%USERPROFILE%\\.config\\magpie\\usage.jsonl' : sample.explanation);
        document.querySelector('.agent-node').title = document.getElementById('agent-name').textContent + '\n' + document.getElementById('agent-request').textContent;
        document.querySelector('.account-node').title = document.getElementById('account-name').textContent + '\n' + document.getElementById('account-model').textContent;
        if (isEmpty) {
          animations.forEach(animation => animation.cancel());
          animations = [];
        }
      }

      /** 模拟托盘显示或隐藏；仅影响原型 DOM，不宣称改变真实窗口或后台文件监视。 */
      function setVisible(visible, exited = false) {
        hud.hidden = !visible;
        document.getElementById('hidden-message').hidden = visible;
        document.getElementById('hidden-label').textContent = exited ? '已模拟退出。显示窗口可重置原型。' : '已模拟隐藏。实际应用中，文件监视继续。';
        closeTray();
      }

      /** 收起原型托盘菜单，并同步按钮展开状态。 */
      function closeTray() {
        trayMenu.hidden = true;
        trayToggle.setAttribute('aria-expanded', 'false');
      }

      /** 切换预览状态；异常与重复显示不触发成功动画。 */
      function onStateChange() {
        renderState(stateSelect.value);
        feedback.textContent = '';
        if (['success', 'long'].includes(stateSelect.value)) pulseRoute();
      }

      /** 演示新记录替换：图与两行一起换到下个固定快照，不累积历史。 */
      function nextRoute() {
        sampleIndex = (sampleIndex + 1) % samples.length;
        stateSelect.value = 'success';
        renderState('success');
        pulseRoute();
        feedback.textContent = '已替换为下一条演示记录。';
      }

      /** 切换原型的置顶视觉状态；真实置顶由后续 Tauri 窗口能力实现。 */
      function togglePin() {
        const button = document.getElementById('pin');
        const pinned = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(pinned));
        button.title = pinned ? '置顶已开启（原型）' : '置顶已关闭（原型）';
        feedback.textContent = pinned ? '已模拟开启置顶。' : '已模拟关闭置顶。';
      }

      /** 在建议尺寸内切换 840/720px，窄视口仍受容器宽度约束。 */
      function toggleWidth() {
        const narrow = hud.classList.toggle('is-narrow');
        document.getElementById('narrow').setAttribute('aria-pressed', String(narrow));
      }

      /** 打开或收起菜单示意，保持键盘可访问。 */
      function toggleTray() {
        trayMenu.hidden = !trayMenu.hidden;
        trayToggle.setAttribute('aria-expanded', String(!trayMenu.hidden));
        if (!trayMenu.hidden) document.getElementById('tray-show').focus();
      }

      /** Escape 关闭菜单；点击菜单外部时同样收起，避免盖住悬浮窗。 */
      function onDocumentKey(event) {
        if (event.key === 'Escape' && !trayMenu.hidden) {
          closeTray();
          trayToggle.focus();
        }
      }

      /** 仅关闭外部点击的托盘示意菜单，不拦截窗口内操作。 */
      function onDocumentClick(event) {
        if (!event.target.closest('.tray-preview')) closeTray();
      }

      stateSelect.addEventListener('change', onStateChange);
      document.getElementById('replay').addEventListener('click', pulseRoute);
      document.getElementById('next-route').addEventListener('click', nextRoute);
      document.getElementById('narrow').addEventListener('click', toggleWidth);
      document.getElementById('pin').addEventListener('click', togglePin);
      document.getElementById('hide-window').addEventListener('click', () => setVisible(false));
      document.getElementById('restore-window').addEventListener('click', () => setVisible(true));
      document.getElementById('tray-show').addEventListener('click', () => setVisible(true));
      document.getElementById('tray-hide').addEventListener('click', () => setVisible(false));
      document.getElementById('tray-exit').addEventListener('click', () => setVisible(false, true));
      trayToggle.addEventListener('click', toggleTray);
      document.addEventListener('keydown', onDocumentKey);
      document.addEventListener('click', onDocumentClick);
      renderState('success');
    })();
  </script>
</body>
</html>
