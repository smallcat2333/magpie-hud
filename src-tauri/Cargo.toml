[package]
name = "magpie-hud"
version = "1.0.33"
description = "只读监视 Magpie 路由结果的桌面悬浮窗"
authors = ["smallcat_SY"]
edition = "2021"

[lib]
name = "magpie_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hud-core = { package = "magpie-hud-core", path = "../crates/hud-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
notify = "8"
ureq = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security",
] }
