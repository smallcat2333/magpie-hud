[package]
name = "magpie-hud"
version = "1.0.2"
description = "只读监视 Magpie 路由结果的 Windows 悬浮窗"
authors = ["smallcat_SY"]
edition = "2021"

[lib]
name = "magpie_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = ["tray-icon"] }
notify = "8"
ureq = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
