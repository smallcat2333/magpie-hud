<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MagpieHUD</title><style>:root{color-scheme:dark;--surface:#17191e;--raised:#20232a;--ink:#f2f0f2;--secondary:#9ba0aa;--route:#e064a2;--warning:#d4b174;--edge:#343840;font-family:"Segoe UI Variable Text","Microsoft YaHei UI","Segoe UI",sans-serif;color:var(--ink);font-size:13px}*{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--route);outline-offset:4px}    .hud {
      width: 100vw; height: 100vh;
      display: grid; grid-template-rows: 44px minmax(0, 1fr) 82px;
      border: 1px solid #41434c; border-radius: 14px; overflow: hidden;
      background: rgb(23 25 30 / 97%);
      box-shadow: 0 16px 44px rgb(0 0 0 / 32%);
    }
    .hud.is-narrow { width: 720px; }
    .window-bar { display: flex; align-items: center; padding: 0 12px 0 22px; gap: 10px; user-select: none; }
    .brand-mark { width: 19px; height: 19px; color: var(--ink); }
    .brand-name { font-family: Bahnschrift, "Segoe UI", sans-serif; font-size: 17px; letter-spacing: -.6px; font-weight: 600; }
    .brand-subtitle { color: var(--secondary); font-size: 11px; padding-left: 12px; border-left: 1px solid var(--edge); }
    .watch-state { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--secondary); font-size: 11px; }
    .watch-icon { width: 13px; height: 13px; }
    .watch-icon .state-warning, .watch-icon .state-waiting { display: none; }
    .hud[data-state="warning"] .state-normal, .hud[data-state="waiting"] .state-normal { display: none; }
    .hud[data-state="warning"] .state-warning, .hud[data-state="waiting"] .state-waiting { display: initial; }
    .hud[data-state="warning"] .watch-icon { color: var(--warning); }
    .window-controls { display: flex; align-items: center; gap: 2px; margin-left: 8px; }
    .window-button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); }
    .window-button svg { width: 15px; height: 15px; }
    .window-button:hover { color: var(--ink); background: #30333c; }
    .window-button[aria-pressed="true"] { color: var(--ink); background: #2c2d36; }
    .flow {
      display: grid; grid-template-columns: minmax(0, 1fr) 64px 120px 64px minmax(0, 1.33fr);
      align-items: center; padding: 4px 24px 12px; min-width: 0;
    }
    .agent-node, .router-node, .account-node { min-width: 0; }
    .node-caption { display: block; color: var(--secondary); font-size: 11px; margin-bottom: 8px; }
    .agent-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; min-width: 0; }
    .agent-icon { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; background: #30313b; flex-shrink: 0; }
    .agent-icon svg { width: 17px; height: 17px; }
    .agent-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
    .agent-request { display: block; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .router-node { text-align: center; align-self: stretch; display: flex; align-items: center; flex-direction: column; justify-content: center; padding-top: 4px; }
    .router-emblem { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #2b2631; border: 1px solid #634153; margin-bottom: 8px; }
    .router-emblem svg { width: 24px; height: 24px; }
    .router-name { font-family: Bahnschrift, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; line-height: 1; letter-spacing: -.7px; }
    .router-host { color: var(--secondary); font-size: 10px; margin-top: 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-node {
      position: relative; padding: 13px 14px; background: var(--raised);
      border: 1px solid #684355; border-radius: 9px;
    }
    .account-node::before { content: ""; position: absolute; left: -1px; top: 22px; bottom: 22px; width: 3px; background: var(--route); border-radius: 2px; }
    .account-caption { display: flex; align-items: center; gap: 6px; color: var(--secondary); font-size: 11px; margin-bottom: 8px; }
    .account-caption svg { color: var(--route); width: 12px; height: 12px; }
    .account-name { font-size: 14px; font-weight: 600; line-height: 20px; margin: 0 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-model { font-size: 11px; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .connector { width: 100%; height: 112px; overflow: visible; }
    .route-track, .route-current, .route-flare { fill: none; stroke-linecap: round; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .route-track { stroke: #444851; }
    .route-current { stroke: var(--route); opacity: .86; }
    .route-flare { stroke: #f2f0f2; stroke-width: 2.5; stroke-dasharray: 12 100; opacity: 0; }
    .port { fill: var(--route); stroke: var(--surface); stroke-width: 2; }
    .hud[data-active="false"] .route-current, .hud[data-active="false"] .route-flare { opacity: 0 !important; }
    .hud[data-active="false"] .port { fill: #676b76; }
    .hud[data-active="false"] .account-node { border-color: var(--edge); }
    .hud[data-active="false"] .account-node::before { background: #676b76; }
    .hud[data-active="false"] .account-caption svg { color: var(--secondary); }
    .hud[data-active="false"] .router-emblem { border-color: var(--edge); background: var(--raised); }
    .route-notes { border-top: 1px solid #30333c; background: rgb(0 0 0 / 10%); padding: 8px 22px; display: grid; grid-template-rows: 32px 32px; gap: 0; min-width: 0; }
    .note-row { display: grid; grid-template-columns: 60px 43px minmax(0, 1fr); align-items: center; gap: 12px; min-width: 0; }
    .note-time { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--secondary); white-space: nowrap; }
    .note-kind { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--secondary); white-space: nowrap; }
    .note-kind svg { width: 11px; height: 11px; flex-shrink: 0; }
    .note-kind.primary svg { color: var(--route); }
    .note-text { margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; line-height: 22px; }
    .note-row:last-child .note-text { color: var(--secondary); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { margin: 0; }
    .hud { border-radius: 0; box-shadow: none; }
.hud[data-state="missing"] .state-normal{display:none}.hud[data-state="missing"] .state-warning{display:initial}</style></head><body><article class="hud" id="hud" data-active="true" data-state="success" aria-label="Magpie 路由监视悬浮窗">
        <header class="window-bar" data-tauri-drag-region="true">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16 7 5l5 9L17 5l4 11M7 5l5 3 5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <span class="brand-name">magpie</span>
          <span class="brand-subtitle">路由监视</span>
          <div class="watch-state" role="status">
            <svg class="watch-icon" viewBox="0 0 16 16" aria-hidden="true">
              <g class="state-normal" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="5.4"/><path d="m5.4 8 1.7 1.7 3.5-3.5"/></g>
              <g class="state-waiting" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="5.4"/><path d="M8 4.6V8l2.4 1.4"/></g>
              <g class="state-warning" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m8 2 6 11H2Z"/><path d="M8 6v3m0 1.4v1"/></g>
            </svg>
            <span id="watch-label">最近一次路由</span>
          </div>
          <div class="window-controls">
            <button id="pin" class="window-button" type="button" aria-pressed="true" aria-label="置顶窗口" title="置顶已开启（原型）">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3h6m-5 0v5l-3 3v1h10v-1l-3-3V3M10 12v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="hide-window" class="window-button" type="button" aria-label="隐藏到托盘" title="隐藏到托盘（原型）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          </div>
        </header>
        <div class="flow" aria-label="请求来源经过 magpie 到达本次命中账号">
          <section class="agent-node" tabindex="0" aria-label="请求来源">
            <span class="node-caption">请求来源</span>
            <div class="agent-heading">
              <span class="agent-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6M8.6 3.7l6.8 16.6M3.7 8.6l16.6 6.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
              <strong class="agent-name" id="agent-name">Claude Desktop</strong>
            </div>
            <span class="agent-request" id="agent-request" title="group/smart-split">group/smart-split</span>
          </section>
          <svg class="connector" viewBox="0 0 100 112" preserveAspectRatio="none" aria-hidden="true">
            <path class="route-track" d="M6 65C46 65 42 38 94 38"/>
            <path class="route-current" d="M6 65C46 65 42 38 94 38"/>
            <path class="route-flare" pathLength="100" d="M6 65C46 65 42 38 94 38"/>
            <circle class="port" cx="6" cy="65" r="4"/><circle class="port" cx="94" cy="38" r="4"/>
          </svg>
          <section class="router-node" tabindex="0" aria-label="本机 magpie 路由器">
            <div class="router-emblem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16 7 5l5 9L17 5l4 11M7 5l5 3 5-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
            <strong class="router-name">magpie</strong>
            <span class="router-host" title="127.0.0.1:3425">127.0.0.1:3425</span>
          </section>
          <svg class="connector" viewBox="0 0 100 112" preserveAspectRatio="none" aria-hidden="true">
            <path class="route-track" d="M6 38C58 38 54 65 94 65"/>
            <path class="route-current" d="M6 38C58 38 54 65 94 65"/>
            <path class="route-flare" pathLength="100" d="M6 38C58 38 54 65 94 65"/>
            <circle class="port" cx="6" cy="38" r="4"/><circle class="port" cx="94" cy="65" r="4"/>
          </svg>
          <section class="account-node" tabindex="0" aria-label="本次命中账号">
            <span class="account-caption"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="account-caption">本次命中</span></span>
            <h2 class="account-name" id="account-name">relay-01@example.com</h2>
            <span class="account-model" id="account-model">grok-4.7-build-fast@500k</span>
          </section>
        </div>
        <section class="route-notes" aria-label="最新路由说明，固定两行" aria-live="polite" aria-atomic="true">
          <div class="note-row">
            <span class="note-time" id="line1-time">20:33:19</span>
            <span class="note-kind primary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="line1-kind">命中</span></span>
            <p class="note-text" id="line1-text"></p>
          </div>
          <div class="note-row">
            <span class="note-time" id="line2-time">20:33:19</span>
            <span class="note-kind"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="line2-kind">说明</span></span>
            <p class="note-text" id="line2-text"></p>
          </div>
        </section>
      </article><script>
(() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let animations = [];
  function text(id, value) { const e = document.getElementById(id); e.textContent = value || ''; e.title = value || ''; }
  function render(s, animate) {
    const hud = document.getElementById('hud');
    hud.dataset.state = s.state; hud.dataset.active = String(!!s.active);
    text('watch-label', s.watchLabel); text('agent-name', s.agent); text('agent-request', s.request);
    text('router-host', s.magpieHost); text('account-caption', s.active ? '本次命中' : '等待记录');
    text('account-name', s.account); text('account-model', s.model);
    for (const n of [1,2]) { text('line'+n+'-time', s['line'+n+'Time']); text('line'+n+'-kind', s['line'+n+'Kind']); text('line'+n+'-text', s['line'+n+'Text']); }
    document.querySelector('.agent-node').title = s.agent + '
' + s.request;
    document.querySelector('.account-node').title = s.account + '
' + s.model;
    if (animate && s.active && !reduced.matches) pulse();
  }
  function pulse() { animations.forEach(a => a.cancel()); animations = [...document.querySelectorAll('.route-flare')].map(path => path.animate([{strokeDashoffset:112,opacity:0},{opacity:1,offset:.15},{strokeDashoffset:-12,opacity:0}],{duration:320,easing:'linear'})); }
  async function invoke(command, args={}) { return window.__TAURI__.core.invoke(command, args); }
  document.getElementById('pin').addEventListener('click', async event => { const button=event.currentTarget; const next=button.getAttribute('aria-pressed')!=='true'; const actual=await invoke('set_pinned',{pinned:next}); button.setAttribute('aria-pressed', String(actual)); button.title=actual?'置顶已开启':'置顶已关闭'; });
  document.getElementById('hide-window').addEventListener('click', () => window.__TAURI__.webviewWindow.getCurrentWebviewWindow().hide());
  window.__TAURI__.event.listen('route-update', ({payload}) => render(payload, true));
  window.__TAURI__.event.listen('config-error', ({payload}) => { text('watch-label', payload); document.getElementById('hud').dataset.state='warning'; });
  invoke('startup_state').then(state => { render(state.snapshot, false); const button=document.getElementById('pin'); button.setAttribute('aria-pressed', String(state.pinned)); button.title=state.pinned?'置顶已开启':'置顶已关闭'; });
})();
</script></body></html>
