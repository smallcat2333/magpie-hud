<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Magpie HUD V.0.0.25(2026/10/21)</title>
  <link rel="icon" href="icons/magpie.svg" type="image/svg+xml">
  <link rel="stylesheet" href="hud.css?v=0.0.25-20261022-inactive-blur">
  <script src="hourly.js?v=0.0.25-20261022-four-ticks" defer></script>
  <script src="hud.js?v=0.0.25-20261022-inactive-blur" defer></script>
</head>
<body>
<main class="hud" id="hud" data-state="waiting" data-sources="compact" data-focus="true">
  <header class="window-bar" id="drag-region" data-tauri-drag-region>
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 4-12 5 10 5-10 4 12M7 5l5 3 5-3"/></svg>
    <h1 class="brand-name">Magpie HUD <span class="app-version" id="app-version">V.0.0.25(2026/10/21)</span></h1><span class="brand-subtitle">路由监视</span>
    <span class="watch-state" id="watch-label" role="status">等待今日记录</span>
    <label class="scope-label" for="session-select">查看</label>
    <select id="session-select" aria-label="按会话查看路由"><option value="*">最近会话</option></select>
    <button id="pin" class="window-button" type="button" aria-label="置顶窗口" aria-pressed="true" title="置顶窗口"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3h6m-5 0v5l-3 3v1h10v-1l-3-3V3M10 12v5"/></svg></button>
    <button id="hide-window" class="window-button" type="button" aria-label="最小化到托盘" title="最小化到托盘"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <button id="close-window" class="window-button" type="button" aria-label="关闭程序" title="关闭程序"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button>
    <div id="window-menu" class="window-menu" hidden>
      <button type="button" data-window-action="reset">初始化位置</button>
      <button type="button" data-window-action="hide">隐藏到托盘</button>
    </div>
  </header>
  <div class="content">
    <aside class="sidebar" aria-label="统计与用量">
    <section class="daily" aria-label="当日统计">
      <div class="daily-heading"><strong>当日</strong><time id="stats-date">—</time></div>
      <dl>
        <div class="metric" id="tokens-metric" tabindex="0"><dt>Token</dt><dd id="daily-tokens">—</dd><small id="request-count">等待记录</small></div>
        <div class="metric" id="speed-metric" tabindex="0"><dt>TPS <span>tok/s</span></dt><dd id="daily-speed">—</dd><small>最近 10 个会话</small></div>
        <div class="metric" id="cost-metric" tabindex="0"><dt>费用估值 <span id="cost-unit"></span> <span id="cost-status" role="status"></span></dt><dd id="daily-cost">未定价</dd><small id="cost-coverage">等待 Magpie 费用</small></div>
        <div class="metric secondary-metric" id="cache-metric" tabindex="0"><dt><span class="label-wide">缓存命中</span><span class="label-compact">缓存</span></dt><dd id="daily-cache">—</dd></div>
        <div class="metric secondary-metric" id="calls-metric" tabindex="0"><dt><span class="label-wide">调用次数</span><span class="label-compact">调用</span></dt><dd id="daily-calls">0</dd></div>
        <div class="metric secondary-metric" id="average-metric" tabindex="0"><dt><span class="label-wide">均次费用</span><span class="label-compact">$/次</span></dt><dd id="daily-average">—</dd></div>
      </dl>
      <span class="stats-scope" id="stats-scope">全部会话</span>
    </section>
    <section class="hourly" aria-label="今日每小时 Token 与金额">
      <div class="hourly-heading"><span class="hourly-key"><i class="hourly-bar-key" aria-hidden="true"></i>Token</span><span class="hourly-key"><i class="hourly-line-key" aria-hidden="true"></i>金额</span></div>
      <div id="hourly-plot" class="hourly-plot" tabindex="0" role="group" aria-label="24 小时趋势，左右方向键查看每小时数值">
        <svg id="hourly-chart" class="hourly-chart" aria-hidden="true"></svg>
        <div id="hourly-tooltip" class="hourly-tooltip" role="status" hidden></div>
      </div>
      <table id="hourly-table" class="hourly-table"><caption>每小时明细</caption><thead><tr><th>时段</th><th>Token</th><th>USD</th></tr></thead><tbody></tbody></table>
    </section>
    <section class="quota" aria-label="账号用量">
      <div id="quota-list" class="quota-list"><p class="quota-empty">等待当前会话的额度</p></div>
    </section>
    </aside>
    <section class="routing" aria-label="Agent 经 magpie 路由到会话账号">
      <svg id="route-lines" class="route-lines" aria-hidden="true"></svg>
      <div class="transit">
      <div class="source-node" tabindex="0" id="source-node">
        <div id="source-list" class="source-list"><div class="source-entry"><div class="source-heading"><span class="source-icon"><img src="icons/claude-color.svg" alt=""></span><strong>等待请求</strong></div></div></div>
      </div>
      <svg class="inbound" viewBox="0 0 48 100" preserveAspectRatio="none" aria-hidden="true"><path class="route-track" d="M2 60C22 60 26 42 46 42"/><path class="route-active" id="inbound-active" d="M2 60C22 60 26 42 46 42"/></svg>
      <div class="router-node" tabindex="0" aria-label="本机 Magpie 路由器">
        <div class="router-emblem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 4-12 5 10 5-10 4 12M7 5l5 3 5-3"/></svg></div>
        <strong>magpie</strong><small id="session-count">0会话</small><span id="router-host">127.0.0.1:3425</span>
      </div>
      </div>
      <div class="route-area" id="route-area">
        <div class="routes" id="routes" role="list" aria-label="最近会话路由" hidden></div>
        <div class="empty-route" id="empty-route"><span class="empty-square">—</span><div><strong>尚无今日会话</strong><small>等待 Magpie 路由写入</small></div></div>
      </div>
    </section>
  </div>
  <section class="route-notes" aria-label="最新路由说明" aria-live="polite" aria-atomic="true">
    <div class="note-row"><time id="line1-time">--:--:--</time><span class="note-kind" id="line1-kind">等待</span><p id="line1-text">等待 Magpie 路由写入…</p></div>
    <div class="note-row"><time id="line2-time">--:--:--</time><span class="note-kind" id="line2-kind">来源</span><p id="line2-text">只读 usage.jsonl</p></div>
  </section>
</main>
<div class="resize-edge north" data-resize="North" aria-hidden="true"></div>
<div class="resize-edge south" data-resize="South" aria-hidden="true"></div>
<div class="resize-edge east" data-resize="East" aria-hidden="true"></div>
<div class="resize-edge west" data-resize="West" aria-hidden="true"></div>
<div class="resize-corner north-west" data-resize="NorthWest" aria-hidden="true"></div>
<div class="resize-corner north-east" data-resize="NorthEast" aria-hidden="true"></div>
<div class="resize-corner south-west" data-resize="SouthWest" aria-hidden="true"></div>
<div class="resize-corner south-east" data-resize="SouthEast" title="拖动调整宽度和高度" aria-hidden="true"></div>
</body>
</html>
