[package]
name = "magpie-hud-core"
version = "1.0.32"
description = "Magpie HUD 只读采集与统计核心"
edition = "2021"

[lib]
name = "hud_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
notify = "8"
ureq = { version = "3", default-features = false }
