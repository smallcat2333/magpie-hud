[package]
name = "magpie-hud-server"
version = "1.0.32"
edition = "2021"
description = "Headless Magpie HUD collector, authenticated API and web dashboard"

[dependencies]
hud-core = { package = "magpie-hud-core", path = "../hud-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
rust-embed = "8"
mime_guess = "2"
async-stream = "0.3"
futures-core = "0.3"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
